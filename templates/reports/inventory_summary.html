{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}
    {% if export_url %}
    <a href="{% url export_url %}" class="btn btn-success float-end">Export Excel</a>
    {% endif %}
</h2>
<div class="table-responsive">
    <table class="data table align-middle">
        <thead><tr><th>Category</th><th>Count</th><th>Total Value</th></tr></thead>
        <tbody>
        {% for r in data %}
        <tr><td data-label="Category">{{ r.category__name }}</td><td data-label="Count">{{ r.count }}</td><td data-label="Total Value">{{ r.total_value|floatformat:2 }}</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
