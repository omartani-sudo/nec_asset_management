{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset QR Labels</title>
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="p-3">
    <div class="no-print d-flex justify-content-between align-items-center mb-3" style="max-width:960px;margin:0 auto 16px;">
        <h1 class="h5 mb-0"><span class="material-symbols-outlined" aria-hidden="true">qr_code</span> Asset QR Labels ({{ labels|length }})</h1>
        <button class="btn btn-primary" onclick="window.print()"><span class="material-symbols-outlined" aria-hidden="true">print</span> Print</button>
    </div>
    <div class="qr-sheet" style="max-width:960px;margin:0 auto;">
        {% for label in labels %}
        <div class="qr-label">
            <div class="qr-code" data-url="{{ label.url }}" aria-hidden="true"></div>
            <div class="t">{{ label.asset_id }}</div>
            <div class="small">{{ label.name }}</div>
            <div class="i">{{ label.location }}</div>
        </div>
        {% empty %}
        <p>No assets selected.</p>
        {% endfor %}
    </div>
    <script src="{% static 'js/vendor/qrcode.min.js' %}"></script>
    <script>
    (function () {
        'use strict';
        document.querySelectorAll('.qr-code').forEach(function (el) {
            if (window.QRCode) {
                new QRCode(el, { text: el.dataset.url, width: 140, height: 140,
                                 correctLevel: QRCode.CorrectLevel.M });
            }
        });
    })();
    </script>
</body>
</html>
