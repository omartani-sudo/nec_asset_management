{% extends "base.html" %}
{% block title %}Delete Asset{% endblock %}
{% block content %}
<h2>Delete Asset</h2>
<div class="alert alert-danger">
    Are you sure you want to delete this asset: <strong>{{ asset.asset_id }} - {{ asset.asset_name }}</strong>?
</div>
<form method="post">
    {% csrf_token %}
    <div class="d-grid d-sm-flex gap-2">
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'fixed_assets:fixed_asset_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
