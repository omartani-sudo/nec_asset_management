{% extends "base.html" %}
{% block title %}Delete Current Asset{% endblock %}
{% block content %}
<h2>Delete Current Asset</h2>
<div class="alert alert-danger">
    Are you sure you want to delete this asset: <strong>{{ asset.asset_id }} - {{ asset.description }}</strong>?
</div>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'current_assets:current_asset_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
